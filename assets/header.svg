<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="최승연, 데이터 분석가. 공식과 평균이 말해주지 않는 것을 현장 데이터로 확인합니다.">
<style>
  /* ================= 색상 설정 (이 부분만 바꾸면 됩니다) ================= */
  :root {
    --bg:       #FFFFFF;  /* 카드 배경 */
    --border:   #E5E7EB;  /* 카드 테두리 */
    --grid:     #EEF0F4;  /* 그래프 격자 */
    --axis:     #CBD2DC;  /* 축 · 연결선 */
    --text:     #111827;  /* 제목 · 본문 글자 */
    --muted:    #6B7280;  /* 보조 글자 */
    --accent-1: #2563EB;  /* 파랑: 현장 실측 · 자격증 */
    --accent-2: #F97316;  /* 주황: 공식 예측 · 수상 */
  }
  /* ===================================================================== */

  .bg { fill: var(--bg); } .border { fill: none; stroke: var(--border); }
  .grid { stroke: var(--grid); } .axis { stroke: var(--axis); }
  .t { fill: var(--text); } .m { fill: var(--muted); }
  .a1 { fill: var(--accent-1); } .a2 { fill: var(--accent-2); }
  .s1 { stroke: var(--accent-1); } .s2 { stroke: var(--accent-2); } .sm { stroke: var(--muted); }
  .t1b { fill: var(--tag1-bg); } .t1t { fill: var(--tag1-text); }
  .t2b { fill: var(--tag2-bg); } .t2t { fill: var(--tag2-text); }
  .t3b { fill: var(--tag3-bg); } .t3t { fill: var(--tag3-text); }
  .t4b { fill: var(--tag4-bg); } .t4t { fill: var(--tag4-text); }
  .t5b { fill: var(--tag5-bg); } .t5t { fill: var(--tag5-text); }

   /* ===== 애니메이션: 9초마다 나타났다 사라지기를 반복 (9s를 바꾸면 속도 조절) ===== */
  .pt { animation: ptLoop 9s ease-out infinite both; transform-box: fill-box; transform-origin: center; }
  .formula { animation: formulaLoop 9s ease-out infinite both; }
  .measured { stroke-dasharray: 520; animation: lineLoop 9s ease-in-out infinite both; }
  .note { animation: noteLoop 9s ease-out infinite both; }
  @keyframes ptLoop { 0% { opacity:0; transform: scale(.2); } 5%, 68% { opacity:1; transform: scale(1); } 76%, 100% { opacity:0; transform: scale(1); } }
  @keyframes formulaLoop { 0% { opacity:0; } 8%, 85% { opacity:1; } 95%, 100% { opacity:0; } }
  @keyframes lineLoop { 0%, 29% { stroke-dashoffset:520; opacity:1; } 40%, 85% { stroke-dashoffset:0; opacity:1; } 95%, 100% { stroke-dashoffset:0; opacity:0; } }
  @keyframes noteLoop { 0%, 42% { opacity:0; } 47%, 85% { opacity:1; } 95%, 100% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect class="bg" width="1200" height="380" rx="18"/><rect class="border" x="0.5" y="0.5" width="1199" height="379" rx="18"/>
<g class="grid" stroke-width="1"><line x1="660" y1="80" x2="1130" y2="80"/><line x1="660" y1="124" x2="1130" y2="124"/><line x1="660" y1="168" x2="1130" y2="168"/><line x1="660" y1="212" x2="1130" y2="212"/><line x1="660" y1="256" x2="1130" y2="256"/><line x1="660" y1="300" x2="1130" y2="300"/><line x1="660" y1="70" x2="660" y2="300"/><line x1="754" y1="70" x2="754" y2="300"/><line x1="848" y1="70" x2="848" y2="300"/><line x1="942" y1="70" x2="942" y2="300"/><line x1="1036" y1="70" x2="1036" y2="300"/><line x1="1130" y1="70" x2="1130" y2="300"/></g>
<line class="axis" x1="660" y1="300" x2="1130" y2="300" stroke-width="2"/>
<line class="axis" x1="660" y1="70" x2="660" y2="300" stroke-width="2"/>
<line class="s2 formula" x1="660" y1="281.0" x2="1130" y2="102.4" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round"/>
<circle class="a1 pt" style="animation-delay:0.90s" cx="685.0" cy="288.2" r="6"/><circle class="a1 pt" style="animation-delay:1.03s" cx="732.0" cy="281.9" r="6"/><circle class="a1 pt" style="animation-delay:1.16s" cx="779.0" cy="263.5" r="6"/><circle class="a1 pt" style="animation-delay:1.29s" cx="826.0" cy="264.5" r="6"/><circle class="a1 pt" style="animation-delay:1.42s" cx="873.0" cy="246.8" r="6"/><circle class="a1 pt" style="animation-delay:1.55s" cx="920.0" cy="240.4" r="6"/><circle class="a1 pt" style="animation-delay:1.68s" cx="967.0" cy="236.6" r="6"/><circle class="a1 pt" style="animation-delay:1.81s" cx="1014.0" cy="219.1" r="6"/><circle class="a1 pt" style="animation-delay:1.94s" cx="1061.0" cy="218.1" r="6"/><circle class="a1 pt" style="animation-delay:2.07s" cx="1108.0" cy="201.6" r="6"/>
<line class="s1 measured" x1="660" y1="290.0" x2="1130" y2="196.0" stroke-width="3" stroke-linecap="round"/>
<g class="note">
  <path class="sm" d="M1144 102.4 h10 V196.0 h-10" fill="none" stroke-width="1.5"/>
  <text class="t" x="1160" y="155.2" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="600">과대</text>
</g>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="15">
  <line class="s2" x1="700" y1="40" x2="736" y2="40" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="m" x="746" y="45">공식 예측</text>
  <circle class="a1" cx="842" cy="40" r="6"/>
  <text class="m" x="856" y="45">현장 실측</text>
</g>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif">
  <text class="a1" x="70" y="104" font-size="20" font-weight="700">Data Analyst</text>
  <text class="t" x="66" y="182" font-size="72" font-weight="800">최승연</text>
  <text class="m" x="70" y="220" font-size="22">Seungyeon Choi</text>
  <text class="t" x="70" y="278" font-size="21">공식과 평균이 말해주지 않는 것을</text>
  <text class="t" x="70" y="310" font-size="21">현장 데이터로 확인합니다.</text>
</g>
</svg>
