<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="최승연, 데이터 분석가. 공식과 평균이 말해주지 않는 것을 현장 데이터로 확인합니다.">
<style>
