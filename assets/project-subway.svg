<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-label="휠체어 이용자의 부산 도시철도 환승 거리 분석">
<style>
  /* ================= 색상 설정 (이 부분만 바꾸면 됩니다) ================= */
  :root {
    --bg:       #FFFFFF;  /* 카드 배경 */
    --border:   #E5E7EB;  /* 카드 테두리 */
    --grid:     #EEF0F4;  /* 그래프 격자 */
    --axis:     #CBD2DC;  /* 축 · 연결선 */
    --text:     #111827;  /* 제목 · 본문 글자 */
    --muted:    #6B7280;  /* 보조 글자 */
    --accent-1: #2563EB;  /* 파랑: 현장 실측 · 자격증 */
    --accent-2: #F97316;  /* 주황: 공식 예측 · 수상 */
    --tag1-bg: #DBEAFE; --tag1-text: #1D4ED8;  /* 태그 1 (파랑) */
    --tag2-bg: #DCFCE7; --tag2-text: #15803D;  /* 태그 2 (초록) */
    --tag3-bg: #F3E8FF; --tag3-text: #7E22CE;  /* 태그 3 (보라) */
    --tag4-bg: #FFEDD5; --tag4-text: #C2410C;  /* 태그 4 (주황) */
    --tag5-bg: #FCE7F3; --tag5-text: #BE185D;  /* 태그 5 (분홍) */
  }
  /* ===================================================================== */

  .bg { fill: var(--bg); } .border { fill: none; stroke: var(--border); }
  .grid { stroke: var(--grid); } .axis { stroke: var(--axis); }
  .t { fill: var(--text); } .m { fill: var(--muted); }
  .a1 { fill: var(--accent-1); } .a2 { fill: var(--accent-2); }
  .s1 { stroke: var(--accent-1); } .s2 { stroke: var(--accent-2); } .sm { stroke: var(--muted); }
  .t1b { fill: var(--tag1-bg); } .t1t { fill: var(--tag1-text); }
  .t2b { fill: var(--tag2-bg); } .t2t { fill: var(--tag2-text); }
  .t3b { fill: var(--tag3-bg); } .t3t { fill: var(--tag3-text); }
  .t4b { fill: var(--tag4-bg); } .t4t { fill: var(--tag4-text); }
  .t5b { fill: var(--tag5-bg); } .t5t { fill: var(--tag5-text); }
</style>
<rect class="bg" width="600" height="350" rx="18"/><rect class="border" x="0.5" y="0.5" width="599" height="349" rx="18"/>
<text class="a2" x="36" y="50" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="700">2025 대학생 논문경진대회 최우수상</text>
<text class="t" x="34" y="122" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="60" font-weight="800">×1.4–2.3</text>
<text class="m" x="36" y="154" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="15">공식이 실제 환승 거리를 과대 계산 (10개 경로 전부)</text>

<line class="axis" x1="380.0" y1="105" x2="560.0" y2="105" stroke-width="2"/>
<rect class="a2" x="428" y="95" width="108" height="20" rx="10"/>
<circle class="a1" cx="380.0" cy="105" r="7"/>
<text class="a1" x="380.0" y="80" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600">실측</text>
<text class="m" x="428" y="138" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">1.4</text>
<text class="m" x="536" y="138" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">2.3</text>
<text class="a2" x="482" y="80" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600">공식 예측</text>
<text class="t" x="36" y="222" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="23" font-weight="700">휠체어 이용자의 부산 도시철도</text>
<text class="t" x="36" y="254" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="23" font-weight="700">환승 거리 분석</text>
<rect class="t1b" x="36" y="296" width="82" height="28" rx="14"/><text class="t1t" x="77" y="315" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600">현장 실측</text><rect class="t2b" x="126" y="296" width="109" height="28" rx="14"/><text class="t2t" x="180" y="315" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600">평가지표 설계</text><rect class="t3b" x="243" y="296" width="78" height="28" rx="14"/><text class="t3t" x="282" y="315" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600">회귀분석</text><rect class="t4b" x="329" y="296" width="47" height="28" rx="14"/><text class="t4t" x="352" y="315" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600">PCA</text><rect class="t5b" x="384" y="296" width="70" height="28" rx="14"/><text class="t5t" x="419" y="315" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="600">Python</text>
</svg>