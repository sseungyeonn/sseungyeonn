<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="자격증과 수상 이력 타임라인">
<style>
  /* ================= 색상 설정 (이 부분만 바꾸면 됩니다) ================= */
  :root {
    --bg:       #FFFFFF;  /* 카드 배경 */
    --border:   #E5E7EB;  /* 카드 테두리 */
    --grid:     #EEF0F4;  /* 그래프 격자 */
    --axis:     #CBD2DC;  /* 축 · 연결선 */
    --text:     #111827;  /* 제목 · 본문 글자 */
    --muted:    #6B7280;  /* 보조 글자 */
    --accent-1: #2563EB;  /* 파랑: 현장 실측 · 자격증 */
    --accent-2: #F97316;  /* 주황: 공식 예측 · 수상 */
  }
  /* ===================================================================== */

  .bg { fill: var(--bg); } .border { fill: none; stroke: var(--border); }
  .grid { stroke: var(--grid); } .axis { stroke: var(--axis); }
  .t { fill: var(--text); } .m { fill: var(--muted); }
  .a1 { fill: var(--accent-1); } .a2 { fill: var(--accent-2); }
  .s1 { stroke: var(--accent-1); } .s2 { stroke: var(--accent-2); } .sm { stroke: var(--muted); }
  .t1b { fill: var(--tag1-bg); } .t1t { fill: var(--tag1-text); }
  .t2b { fill: var(--tag2-bg); } .t2t { fill: var(--tag2-text); }
  .t3b { fill: var(--tag3-bg); } .t3t { fill: var(--tag3-text); }
  .t4b { fill: var(--tag4-bg); } .t4t { fill: var(--tag4-text); }
  .t5b { fill: var(--tag5-bg); } .t5t { fill: var(--tag5-text); }
</style>
<rect class="bg" width="1200" height="340" rx="18"/><rect class="border" x="0.5" y="0.5" width="1199" height="339" rx="18"/>
<g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="14">
  <circle class="a1" cx="900" cy="30" r="6"/><text class="m" x="912" y="35">자격증</text>
  <circle class="a2" cx="980" cy="30" r="6"/><text class="m" x="992" y="35">수상 · 경력</text>
  <circle class="bg sm" cx="1088" cy="30" r="6" stroke-width="2"/><text class="m" x="1100" y="35">예정</text>
</g>
